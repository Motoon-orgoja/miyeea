<style>
/* the day's tasks per book, then statistics */
.bk{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.bk:first-child{border-top:0;padding-top:0}
.bkh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bkt{font-family:var(--verse);font-size:21px;font-weight:700;color:var(--ink);text-decoration:none}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks li{display:block;background:var(--bg);border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600}
.tasks li::before{content:"○ ";color:var(--gold)}
.tasks li.done{color:var(--muted);font-weight:400}
.tasks li.done::before{content:"✓ ";color:var(--accent)}
.tasks small{display:block;padding-inline-start:18px;color:var(--muted);font-size:12px;font-weight:400}
a.btn{text-decoration:none;text-align:center}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;text-align:center}
.tiles div{background:var(--bg);border-radius:12px;padding:10px 4px}
.tiles b{display:block;font-size:26px;font-variant-numeric:tabular-nums;color:var(--accent)}
.tiles small{color:var(--muted);font-size:12px}
.pg{display:flex;flex-direction:column;gap:4px}
.pgh{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;flex-wrap:wrap}
.pgh small{color:var(--muted);font-weight:400}
.bar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;max-width:340px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--veil)}
.heat i.on{background:var(--accent)}
.heat i.now{outline:2px solid var(--gold);outline-offset:-2px}
.empty{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav class="books" aria-label="المتون"><a href="home.html" data-book="home" aria-current="page">وردي اليوم</a><a href="./" data-book="miyeea">الميئية</a><a href="munajat.html" data-book="munajat">المناجاة</a><a href="shatibiyya.html" data-book="shatibiyya">الشاطبية</a><a href="jazariyya.html" data-book="jazariyya">الجزرية</a><a href="riyad.html" data-book="riyad">رياض الصالحين</a><a href="qudouri.html" data-book="qudouri">القدوري</a></nav>
    <h1>وردي اليوم</h1>
    <p id="dayLbl"></p>
  </header>

  <section class="card">
    <div class="chapstat" id="todaySum"></div>
    <div id="todayList"></div>
  </section>

  <section class="card" id="restCard" hidden>
    <div class="eyebrow">متون ما بلّشت فيها بعد · اضغط على أي واحد لتبلّش</div>
    <div class="ui-col" id="restList"></div>
  </section>

  <section class="card">
    <div class="eyebrow">إحصائياتك</div>
    <div class="tiles" id="tiles"></div>
    <div class="eyebrow">تقدمك بكل متن</div>
    <div id="progList" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="eyebrow">آخر ١٢ أسبوع · كل مربع يوم، والأخضر يوم حفظت أو راجعت فيه</div>
    <div class="heat" id="heat"></div>
    <p class="note" style="margin:0">الأرقام من تقدمك على هالجهاز. والمحفوظ القديم اللي بتعلّمه بينحسب معها.</p>
  </section>
</div>
