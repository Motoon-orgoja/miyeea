name = "mutoon-sync"
main = "worker.js"
compatibility_date = "2026-01-01"

# create it once with: npx wrangler kv namespace create SYNC   — then paste the id here
[[kv_namespaces]]
binding = "SYNC"
id = "REPLACE_WITH_KV_ID"

# «الحلقات»: npx wrangler d1 create mutoon-circles — paste the id here, then run schema.sql (see its first lines)
[[d1_databases]]
binding = "CIRCLES"
database_name = "mutoon-circles"
database_id = "REPLACE_WITH_D1_ID"
